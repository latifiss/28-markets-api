services:
  - type: web
    name: 28-markets-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: api
      - key: MONGODB_MAX_POOL_SIZE
        value: "30"
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MARKET_DATA_ADMIN_USER_IDS
        sync: false
      - key: API_RATE_LIMIT_MAX
        value: "600"
      - key: API_WRITE_RATE_LIMIT_MAX
        value: "60"
      - key: API_IP_RATE_LIMIT_MAX
        value: "1200"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"

  - type: worker
    name: 28-markets-usage-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run worker:usage
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: api
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"
      - key: REDIS_URL
        sync: false
